<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Security News Digest</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 800px; margin: 0 auto; }
        .header { background-color: #1976d2; color: white; padding: 20px; text-align: center; }
        .section { margin: 30px 0; }
        .section-title { background-color: #f5f5f5; padding: 10px; border-left: 4px solid #1976d2; margin: 20px 0; }
        .news-item { margin: 20px 0; padding: 15px; border: 1px solid #e0e0e0; border-radius: 5px; }
        .news-title { font-weight: bold; font-size: 16px; color: #1976d2; margin-bottom: 10px; }
        .news-description { margin: 10px 0; line-height: 1.5; }
        .news-meta { font-size: 12px; color: #666; margin-top: 10px; }
        .news-link { color: #1976d2; text-decoration: none; }
        .news-link:hover { text-decoration: underline; }
        .footer { margin-top: 30px; padding: 15px; background-color: #f5f5f5; font-size: 12px; color: #666; text-align: center; }
        .context-analysis { background-color: #e3f2fd; padding: 15px; margin: 15px 0; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📰 Security News Digest</h1>
        <p>Latest Cybersecurity Intelligence and Analysis</p>
    </div>

    <div class="content">
        {{NEWS_SECTIONS}}
    </div>

    <div class="footer">
        <p><strong>Generated:</strong> {{GENERATION_DATE}}</p>
        <p><strong>Total News Items:</strong> {{TOTAL_NEWS_COUNT}}</p>
        <p>This digest provides context and analysis for security teams to stay informed about emerging threats and industry developments.</p>
    </div>
</body>
</html>
