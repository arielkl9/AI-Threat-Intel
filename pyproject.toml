[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "threatintel"
version = "2.0.0"
description = "AI threat-intelligence pipeline: RSS -> LLM classification/CVE research -> email reports."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ariel Klinerman" }]
keywords = ["threat-intelligence", "cve", "openai", "perplexity", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "feedparser>=6.0",
    "requests>=2.32",
    "openai>=1.40",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.140",
    "python-dotenv>=1.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/arielkl9/AI-Threat-Intel"
Issues = "https://github.com/arielkl9/AI-Threat-Intel/issues"

[project.scripts]
threatintel = "threatintel.cli:main"

[tool.setuptools]
packages = ["threatintel"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
